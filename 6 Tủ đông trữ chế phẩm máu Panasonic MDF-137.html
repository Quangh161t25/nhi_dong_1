<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu theo dõi nhiệt độ tủ âm -35°C</title>
    <style>
        :root {
            --border: #333;
            --grid: #444;
            --text: #000;
            --paper: #fff;
            --line: red;
            --dot: #555;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #f0f0f0;
            font-family: "Times New Roman", Times, serif;
            color: var(--text);
        }

        .page {
            width: 297mm;
            min-height: 210mm;
            margin: 10px auto;
            background: var(--paper);
            padding: 10mm;
            position: relative;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            font-size: 11pt;
            font-weight: bold;
            margin-bottom: 5mm;
            line-height: 1.4;
        }

        .title-block {
            text-align: center;
            margin-bottom: 5mm;
        }

        .title-block h1 {
            margin: 0;
            font-size: 16pt;
            text-transform: uppercase;
        }

        .title-block .sub-title {
            font-size: 11pt;
            font-weight: normal;
        }

        .meta-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1.2fr;
            gap: 5mm;
            font-size: 11pt;
            margin-bottom: 3mm;
        }

        .meta-item {
            margin-bottom: 2px;
        }

        .print-checkbox {
            display: inline-block;
            width: 11pt;
            height: 11pt;
            border: 1px solid #000;
            margin: 0 2px;
            vertical-align: -1px;
            text-align: center;
            font-size: 10pt;
            line-height: 10pt;
            font-weight: bold;
        }

        .print-checkbox.checked::after {
            content: '✓';
            display: block;
        }
        .dots {
            border-bottom: 1px dotted #000;
            display: inline-block;
            min-width: 30mm;
            padding: 0 5px;
        }

        .chart-container {
            position: relative;
            border: 1.5px solid var(--border);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
        }

        th,
        td {
            border: 1px solid var(--grid);
            text-align: center;
            padding: 0;
            height: 22px;
            font-size: 10pt;
        }

        .col-temp {
            width: 45px;
            font-weight: bold;
        }

        .col-slot {
            width: auto;
        }

        thead th {
            background-color: #f9f9f9;
        }

        .day-header {
            font-size: 11pt;
            font-weight: bold;
        }

        .slot-header {
            font-size: 9pt;
        }

        .dot-cell {
            position: relative;
            height: 25px;
        }

        .dot-cell.has-point::after {
            content: "";
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--dot);
            border-radius: 50%;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
        }

        .signature-row td {
            height: 60px;
            font-size: 9pt;
            vertical-align: bottom;
            padding-bottom: 5px;
        }

        .chart-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .footer-note {
            margin-top: 3mm;
            font-size: 10pt;
            font-style: italic;
        }

        .doc-code {
            position: absolute;
            bottom: 10mm;
            left: 10mm;
            font-size: 10pt;
        }

        .print-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            z-index: 999;
        }

        @media print {
            body {
                background: none;
            }

            .page {
                margin: 0;
                box-shadow: none;
                page-break-after: always;
            }

            .print-btn {
                display: none;
            }
        }
    </style>

    <style id="maintenance-form-style">
        .maintenance-sheet {
            width: 297mm;
            min-height: 210mm;
            margin: 10px auto;
            padding: 8mm 10mm;
            background: #fff;
            color: #111;
            font-family: "Times New Roman", Times, serif;
            page-break-before: always;
            page-break-after: auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, .1);
        }

        .maintenance-sheet * {
            box-sizing: border-box;
        }

        .maintenance-top-line {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
        }

        .maintenance-unit {
            line-height: 1.2;
            font-size: 24px;
            font-weight: normal;
            text-align: left;
        }

        .maintenance-title-wrap {
            text-align: center;
            flex: 1;
        }

        .maintenance-title {
            margin: 0;
            font-size: 36px;
            font-weight: 700;
            letter-spacing: .5px;
        }

        .maintenance-month-line {
            margin-top: 6px;
            font-size: 22px;
        }

        .maintenance-section-title {
            margin: 12px 0 6px;
            font-size: 26px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .maintenance-table {
            width: 100%;
            border-collapse: collapse;
            table-layout: fixed;
            position: static;
            z-index: auto;
        }

        .maintenance-table th,
        .maintenance-table td {
            border: 1px solid #222;
            padding: 3px 5px;
            font-size: 16px;
            height: auto;
            vertical-align: middle;
            text-align: center;
            font-weight: normal;
            color: #111;
            background: #fff;
        }

        .maintenance-table thead th {
            font-weight: 700;
        }

        .maintenance-stt {
            width: 36px;
            text-align: center;
        }

        .maintenance-task-col {
            width: 240px;
            font-weight: 600;
            text-align: left;
        }

        .maintenance-day {
            width: 28px;
            height: 34px;
            text-align: center;
            font-size: 14px;
            padding: 0;
        }

        .maintenance-daily tbody .maintenance-task-col {
            font-size: 14px;
            line-height: 1.2;
            font-weight: 600;
        }

        .maintenance-tick {
            font-size: 16px;
            font-weight: 700;
            line-height: 1;
        }

        .maintenance-sig-row td {
            height: 64px;
            vertical-align: top;
            font-size: 14px;
        }

        .maintenance-sig-row .maintenance-day {
            font-size: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: clip;
            vertical-align: middle;
            position: relative;
            text-align: center;
        }

        .maintenance-operator-signature {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) rotate(-90deg);
            transform-origin: center center;
            font-size: 12px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: .6px;
            white-space: nowrap;
        }

        .maintenance-weekly th,
        .maintenance-periodic th {
            text-align: center;
            font-weight: 700;
        }

        .maintenance-weekly td {
            height: 36px;
        }

        .maintenance-w1 { width: 280px; }
        .maintenance-w2 { width: auto; }
        .maintenance-w3 { width: 220px; }

        .maintenance-periodic td {
            height: 44px;
        }

        .maintenance-foot {
            margin-top: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
        }

        @media print {
            .maintenance-sheet {
                width: 297mm;
                min-height: 210mm;
                margin: 0;
                padding: 8mm 10mm;
                box-shadow: none;
                break-inside: avoid-page;
                page-break-inside: avoid;
            }

            .maintenance-top-line,
            .maintenance-section-title,
            .maintenance-table,
            .maintenance-foot {
                break-inside: avoid-page;
                page-break-inside: avoid;
            }
        }
    </style>
</head>

<body>
    <button class="print-btn" onclick="window.print()">IN PHIẾU</button>
    <div id="pages-container"></div>

    <script>
        // Dải nhiệt độ tương ứng cho tủ âm: Trống (> -31), -31, -32, -33, -34, -35, Trống (< -35)
        const TEMPS = [-30, -31, -32, -33, -34, -35, -36];

        const DAYS_PER_PAGE = 7;
        const SLOTS_PER_DAY = 6;

        function getParams() {
            const search = window.location.search || '';
            const normalizedSearch = search.replace(/\?/g, '&').replace(/^&+/, '');
            const params = new URLSearchParams(normalizedSearch);

            let dataEntries = [];
            for (const [key, value] of params.entries()) {
                if (key === 'data') {
                    dataEntries.push(value);
                } else if (/^\d{1,2}L\d/i.test(key)) {
                    dataEntries.push(key + (value ? '=' + value : ''));
                }
            }

            return {
                thang: params.get('thang') || '',
                tu: params.get('tu') || '',
                data: dataEntries.join('|'),
                mnk: params.get('mnk') || '',
                mtb: params.get('mtb') || '',
                nql: params.get('nql') || '',
                hshc: params.get('hshc') || ''
            };
        }

        function parseData(dataStr) {
            const map = {};
            if (!dataStr) return map;

            const items = dataStr.split(/[|&]/);
            items.forEach(item => {
                item = item.replace(/\.$/, '');
                const match = item.trim().match(/^(\d+)L(\d+)(?:_t)?(-?\d+)(?:(?:_a_?|_)(.*))?$/i);
                if (match) {
                    const day = parseInt(match[1]);
                    const slot = parseInt(match[2]);
                    const temp = parseInt(match[3]);
                    const name = match[4] || '';
                    if (!map[day]) map[day] = {};
                    map[day][slot] = { temp, name };
                }
            });
            return map;
        }

        function getDaysInMonth(monthStr) {
            if (!monthStr) return 31;
            const cleanMonth = monthStr.split(/[?&]/)[0];
            const parts = cleanMonth.split('/');
            const year = parseInt(parts[0]);
            const month = parseInt(parts[1]);
            if (isNaN(year) || isNaN(month)) return 31;
            return new Date(year, month, 0).getDate();
        }

        function renderPage(pageIdx, startDay, endDay, monthStr, meta, dataMap) {
            const daysCount = endDay - startDay + 1;
            const cleanMonth = monthStr.split(/[?&]/)[0];
            const monthParts = cleanMonth.split('/');
            const year = monthParts[0] || '';
            const month = monthParts[1] || '';

            const container = document.getElementById('pages-container');
            const pageEl = document.createElement('div');
            pageEl.className = 'page';
            pageEl.id = `page-${pageIdx}`;

            let html = `
                <div class="header-top">
                    <div>
                        <div>Bệnh viện Nhi Đồng 1</div>
                        <div style="font-weight: normal; font-style: italic;">Ban QLCLXN</div>
                        <div>Khoa Xét nghiệm Huyết học</div>
                    </div>
                    <div style="font-weight: normal; max-width: 50%; text-align: right;">
                        Phiếu theo dõi nhiệt độ tủ âm trữ huyết tương, tủa lạnh -35°C
                    </div>
                </div>
                <div class="title-block">
                    <h1>PHIẾU THEO DÕI NHIỆT ĐỘ TỦ ÂM TRỮ HUYẾT TƯƠNG, TỦA LẠNH -35°C</h1>
                    <div class="sub-title">(TRANG ${pageIdx + 1})</div>
                </div>
                <div class="meta-grid">
                    <div>
                        <div class="meta-item"><b>Loại tủ (-35°C):</b> Panasonic MDF-137</div>
                        <div class="meta-item"><b>Người quản lý:</b> NHN028</div>
                    </div>
                    <div>
                        <div class="meta-item"><b>Mã thiết bị:</b> HE-bb-026</div>
                        <div class="meta-item"><b>Mã nhiệt kế:</b> HE-bb-013</div>
                        <div class="meta-item"><b>Hệ số hiệu chỉnh:</b> <span class="dots">${meta.hshc || ''}</span></div>
                    </div>
                    <div style="text-align: right;">
                        <div class="meta-item"><b>Lưu:</b> <span class="print-checkbox"></span> Mẫu BP &nbsp; <span class="print-checkbox"></span> Hóa chất &nbsp; <span class="print-checkbox checked"></span> Khác: ..........</div>
                        <div class="meta-item"><b>Tháng:</b> <span class="dots" style="min-width:15mm">${month}</span> <b>Năm:</b> <span class="dots" style="min-width:20mm">${year}</span></div>
                    </div>
                </div>
                <div class="chart-container" id="chart-cont-${pageIdx}">
                    <svg class="chart-svg" id="svg-${pageIdx}"></svg>
                    <table>
                        <thead>
                            <tr>
                                <th rowspan="2" class="col-temp">Ngày</th>
                                ${Array.from({ length: daysCount }, (_, i) => `<th colspan="${SLOTS_PER_DAY}" class="day-header">${startDay + i}</th>`).join('')}
                            </tr>
                            <tr>
                                ${Array.from({ length: daysCount * SLOTS_PER_DAY }, (_, i) => `<th class="slot-header">${(i % SLOTS_PER_DAY) + 1}</th>`).join('')}
                            </tr>
                            <tr>
                                <th class="col-temp">T°</th>
                                ${Array.from({ length: daysCount * SLOTS_PER_DAY }, () => `<th></th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
                            ${TEMPS.map(t => `
                                <tr>
                                    <td class="col-temp">${(t === -30 || t === -36) ? '' : t}</td>
                                    ${Array.from({ length: daysCount }, (_, dIdx) => {
                const d = startDay + dIdx;
                return Array.from({ length: SLOTS_PER_DAY }, (_, sIdx) => {
                    const s = sIdx + 1;
                    const tempRaw = (dataMap[d] && dataMap[d][s]) ? dataMap[d][s].temp : null;
                    let isPoint = false;
                    if (tempRaw !== null) {
                        if (t === -30) isPoint = tempRaw > -31;
                        else if (t === -36) isPoint = tempRaw < -35;
                        else isPoint = tempRaw === t;
                    }
                    return `<td class="dot-cell ${isPoint ? 'has-point' : ''}" data-day="${d}" data-slot="${s}" data-temp="${t}"></td>`;
                }).join('');
            }).join('')}
                                </tr>
                            `).join('')}
                            <tr class="signature-row">
                                <td class="col-temp">Tên</td>
                                ${Array.from({ length: daysCount }, (_, dIdx) => {
                const d = startDay + dIdx;
                return Array.from({ length: SLOTS_PER_DAY }, (_, sIdx) => {
                    const s = sIdx + 1;
                    const name = (dataMap[d] && dataMap[d][s]) ? dataMap[d][s].name : '';
                    return `<td style="writing-mode: vertical-rl; transform: rotate(180deg);">${name}</td>`;
                }).join('');
            }).join('')}
                            </tr>
                            <tr class="signature-row">
                                <td class="col-temp" style="font-weight: bold;">Trưởng bộ phận</td>
                                <td colspan="${daysCount * SLOTS_PER_DAY}" style="text-align: center; font-weight: bold; font-size: 11pt; vertical-align: middle;">NHN028</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="footer-note" style="line-height: 1.8;">
                    <div>Lần 1-7:00, Lần 2-11:00, Lần 3-15:00, Lần 4-19:00, Lần 5-23:00, Lần 6-3:00</div>
                    <div style="border-bottom: 1px dotted #000; margin-top: 10px;"></div>
                    <div style="border-bottom: 1px dotted #000; margin-top: 15px;"></div>
                    <div style="border-bottom: 1px dotted #000; margin-top: 15px;"></div>
                    <div style="border-bottom: 1px dotted #000; margin-top: 15px;"></div>
                </div>
                <div class="doc-code">FM-EQ-HE-003 V4.0</div>
            `;

            pageEl.innerHTML = html;
            container.appendChild(pageEl);
        }

        function drawLines(pageIdx, startDay, endDay, dataMap) {
            const svg = document.getElementById(`svg-${pageIdx}`);
            const container = document.getElementById(`chart-cont-${pageIdx}`);
            const rect = container.getBoundingClientRect();

            svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
            svg.innerHTML = '';

            const points = [];
            for (let d = startDay; d <= endDay; d++) {
                if (!dataMap[d]) continue;
                for (let s = 1; s <= SLOTS_PER_DAY; s++) {
                    if (!dataMap[d][s]) continue;
                    const val = dataMap[d][s].temp;
                    let targetTemp = val;
                    if (val > -31) targetTemp = -30;
                    else if (val < -35) targetTemp = -36;

                    const cell = document.querySelector(`#page-${pageIdx} td[data-day="${d}"][data-slot="${s}"][data-temp="${targetTemp}"]`);
                    if (cell) {
                        const cRect = cell.getBoundingClientRect();
                        points.push({
                            x: (cRect.left + cRect.width / 2) - rect.left,
                            y: (cRect.top + cRect.height / 2) - rect.top
                        });
                    }
                }
            }

            if (points.length < 2) return;

            const path = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            path.setAttribute("points", points.map(p => `${p.x},${p.y}`).join(' '));
            path.setAttribute("stroke", "red");
            path.setAttribute("stroke-width", "1");
            path.setAttribute("fill", "none");
            svg.appendChild(path);
        }

        function init() {
            const params = getParams();
            const dataMap = parseData(params.data);
            const totalDays = getDaysInMonth(params.thang);
            const totalPages = Math.ceil(totalDays / DAYS_PER_PAGE);

            for (let i = 0; i < totalPages; i++) {
                const startDay = i * DAYS_PER_PAGE + 1;
                const endDay = Math.min((i + 1) * DAYS_PER_PAGE, totalDays);
                renderPage(i, startDay, endDay, params.thang, params, dataMap);
            }

            setTimeout(() => {
                for (let i = 0; i < totalPages; i++) {
                    const startDay = i * DAYS_PER_PAGE + 1;
                    const endDay = Math.min((i + 1) * DAYS_PER_PAGE, totalDays);
                    drawLines(i, startDay, endDay, dataMap);
                }
            }, 500);
        }

        window.onload = init;
        window.onresize = () => {
            const params = getParams();
            const dataMap = parseData(params.data);
            const totalDays = getDaysInMonth(params.thang);
            const totalPages = Math.ceil(totalDays / DAYS_PER_PAGE);
            for (let i = 0; i < totalPages; i++) {
                const startDay = i * DAYS_PER_PAGE + 1;
                const endDay = Math.min((i + 1) * DAYS_PER_PAGE, totalDays);
                drawLines(i, startDay, endDay, dataMap);
            }
        };
    </script>
    <script id="maintenance-form-script">
        (function () {
            function safeDecode(value) {
                let output = String(value || '').replace(/\+/g, ' ');
                for (let i = 0; i < 2; i++) {
                    try {
                        const decoded = decodeURIComponent(output);
                        if (decoded === output) break;
                        output = decoded;
                    } catch (err) {
                        break;
                    }
                }
                return output;
            }

            function normalizeSearch() {
                return (window.location.search || '').replace(/^\?/, '').replace(/\?/g, '&');
            }

            function splitMonth(value) {
                const normalized = safeDecode(value).trim().replace(/[-.]/g, '/');
                const parts = normalized.split('/').filter(Boolean);
                if (parts.length >= 2) return { year: parts[0], month: parts[1].padStart(2, '0') };
                return { year: '', month: normalized };
            }

            function expandEntries(value) {
                return safeDecode(value)
                    .split(/[|&,;]/)
                    .map(function (item) { return item.trim().replace(/[.=]+$/, ''); })
                    .filter(Boolean);
            }

            function collectEntriesFromParams(params) {
                const entries = [];
                for (const [key, value] of params.entries()) {
                    const decodedKey = safeDecode(key).trim();
                    const decodedValue = safeDecode(value).trim();
                    if (decodedKey === 'data' || decodedKey === 'entries') {
                        entries.push.apply(entries, expandEntries(decodedValue));
                    } else if (/^\d{1,2}[SC]/i.test(decodedKey) || /^\d{1,2}L\d/i.test(decodedKey)) {
                        entries.push(decodedKey + (decodedValue ? '_' + decodedValue : ''));
                    }
                }
                return entries;
            }

            function collectEntries() {
                const search = normalizeSearch();
                const entries = [];
                entries.push.apply(entries, collectEntriesFromParams(new URLSearchParams(search)));
                entries.push.apply(entries, collectEntriesFromParams(new URLSearchParams(safeDecode(search))));

                safeDecode(search).split('&').forEach(function (part) {
                    const item = part.trim();
                    if (!item) return;
                    const equalIndex = item.indexOf('=');
                    const key = equalIndex >= 0 ? item.slice(0, equalIndex) : item;
                    const value = equalIndex >= 0 ? item.slice(equalIndex + 1) : '';
                    if (key === 'data' || key === 'entries') {
                        entries.push.apply(entries, expandEntries(value));
                    } else if (/^\d{1,2}[SC]/i.test(key) || /^\d{1,2}L\d/i.test(key)) {
                        entries.push(key + (value ? '_' + value : ''));
                    }
                });

                return Array.from(new Set(entries.map(function (item) {
                    return item.trim().replace(/[.=]+$/, '');
                }).filter(Boolean)));
            }

            function cleanOperatorName(raw) {
                let name = safeDecode(raw).trim();
                name = name.replace(/^[\s_=:-]+/, '');
                name = name.replace(/^t?-?\d+(?:[.,]\d+)?/i, '');
                name = name.replace(/^[\s_=:-]+/, '');
                name = name.replace(/^a\d*(?:[.,]\d+)?/i, '');
                name = name.replace(/^[\s_=:-]+/, '');
                name = name.replace(/^\d+(?:[.,]\d+)?[\s_=:-]+/, '');
                return name.trim();
            }

            function parseOperators() {
                const operators = {};
                const firstSlotFallback = {};

                collectEntries().forEach(function (entry) {
                    let match = entry.match(/^(\d{1,2})([SC])(.*)$/i);
                    if (match) {
                        const day = Number(match[1]);
                        const session = match[2].toUpperCase();
                        const name = cleanOperatorName(match[3]);
                        if (session === 'S' && name && !operators[day]) operators[day] = name;
                        return;
                    }

                    match = entry.match(/^(\d{1,2})L(\d+)(.*)$/i);
                    if (match) {
                        const day = Number(match[1]);
                        const slot = Number(match[2]);
                        const name = cleanOperatorName(match[3]);
                        if (!name) return;
                        if (!firstSlotFallback[day] || slot < firstSlotFallback[day].slot) {
                            firstSlotFallback[day] = { slot: slot, name: name };
                        }
                        if (slot === 1 && !operators[day]) operators[day] = name;
                    }
                });

                Object.keys(firstSlotFallback).forEach(function (day) {
                    if (!operators[day]) operators[day] = firstSlotFallback[day].name;
                });

                return operators;
            }

            function escapeHtml(value) {
                return String(value || '').replace(/[&<>"]/g, function (ch) {
                    return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch];
                });
            }

            function dayCells(contentFactory) {
                let html = '';
                for (let day = 1; day <= 31; day++) {
                    html += '<td class="maintenance-day">' + contentFactory(day) + '</td>';
                }
                return html;
            }

            function renderMaintenanceForm() {
                if (document.getElementById('maintenance-form-page')) return;

                const params = new URLSearchParams(normalizeSearch());
                const monthParts = splitMonth(params.get('thang') || '');
                const operators = parseOperators();
                const monthText = monthParts.month || '......';
                const yearText = monthParts.year || '........';

                const sheet = document.createElement('div');
                sheet.className = 'maintenance-sheet';
                sheet.id = 'maintenance-form-page';
                sheet.innerHTML = `
                    <div class="maintenance-top-line">
                        <div class="maintenance-unit">
                            <div>Bệnh viện Nhi Đồng 1</div>
                            <div>Ban QLCLXN</div>
                            <div>Khoa XN Huyết học</div>
                        </div>
                        <div class="maintenance-title-wrap">
                            <h1 class="maintenance-title">PHIẾU BẢO TRÌ THIẾT BỊ ....................</h1>
                            <div class="maintenance-month-line">Tháng ${escapeHtml(monthText)}/${escapeHtml(yearText)}</div>
                        </div>
                    </div>

                    <div class="maintenance-section-title">I. Bảo dưỡng hằng ngày: (Người sử dụng thực hiện)</div>
                    <table class="maintenance-table maintenance-daily">
                        <thead>
                            <tr>
                                <th class="maintenance-stt">S<br>T<br>T</th>
                                <th class="maintenance-task-col">Ngày</th>
                                ${dayCells(function (day) { return day; })}
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td class="maintenance-stt">1</td>
                                <td class="maintenance-task-col">Vệ sinh màn hình, bàn phím, bệ mặt máy bằng dung dịch khử khuẩn.</td>
                                ${dayCells(function (day) { return operators[day] ? '<span class="maintenance-tick">✓</span>' : ''; })}
                            </tr>
                            <tr>
                                <td class="maintenance-stt">2</td>
                                <td class="maintenance-task-col">Kiểm tra tình trạng máy (điện, hóa chất, vật tư tiêu hao)</td>
                                ${dayCells(function (day) { return operators[day] ? '<span class="maintenance-tick">✓</span>' : ''; })}
                            </tr>
                            <tr class="maintenance-sig-row">
                                <td class="maintenance-stt">3</td>
                                <td class="maintenance-task-col">Người thực hiện</td>
                                ${dayCells(function (day) { return operators[day] ? '<span class="maintenance-operator-signature">' + escapeHtml(operators[day]) + '</span>' : ''; })}
                            </tr>
                        </tbody>
                    </table>

                    <div class="maintenance-section-title">II. Bảo dưỡng hằng tuần: (Người sử dụng thực hiện)</div>
                    <table class="maintenance-table maintenance-weekly">
                        <thead>
                            <tr>
                                <th class="maintenance-w1">Thời gian thực hiện</th>
                                <th class="maintenance-w2">Nội dung thực hiện</th>
                                <th class="maintenance-w3">Người thực hiện</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr><td>Tuần 1 (ngày....................)</td><td></td><td></td></tr>
                            <tr><td>Tuần 2 (ngày....................)</td><td></td><td></td></tr>
                            <tr><td>Tuần 3 (ngày....................)</td><td></td><td></td></tr>
                            <tr><td>Tuần 4 (ngày....................)</td><td></td><td></td></tr>
                        </tbody>
                    </table>

                    <div class="maintenance-section-title">III. Bảo dưỡng tháng/ quý/ 6 tháng/ 12 tháng : KS công ty thực hiện</div>
                    <table class="maintenance-table maintenance-periodic">
                        <thead>
                            <tr>
                                <th style="width:45%;">NỘI DUNG BẢO TRÌ</th>
                                <th colspan="2">Ngày ..........Tháng ..............Năm...............</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Thực hiện theo nội dung của phụ lục bảo trì thiết bị (SD-EQ-AL-003/1001)</td>
                                <td style="width:27%;">KS thực hiện:</td>
                                <td style="width:28%;">NV tiếp nhận:</td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="maintenance-foot">
                        <div>FM-EQ-HE-006 V2.0</div>
                        <div>Ngày hiệu lực 01/05/2021</div>
                    </div>
                `;
                document.body.appendChild(sheet);
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', renderMaintenanceForm);
            } else {
                renderMaintenanceForm();
            }
        })();
    </script>
</body>

</html>
