<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Theo Dõi Nhiệt Độ Tủ Âm Sâu (-70°C) - Bệnh Viện Nhi Đồng 1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @media print {
            .no-print { display: none; }
            body { background: white; }
            .page-break { page-break-after: always; }
        }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #333; padding: 4px; text-align: center; font-size: 12px; }
        .header-info { margin-bottom: 20px; }
        .header-title { text-align: center; font-weight: bold; font-size: 16px; margin: 10px 0; text-transform: uppercase; }
        .rotated-text { writing-mode: vertical-rl; transform: rotate(180deg); }
    </style>
</head>
<body class="bg-gray-100 p-4 font-sans">

    <div class="max-w-5xl mx-auto space-y-12">
        
        <!-- BẢNG 2: TỦ ÂM SÂU -70°C -->
        <section class="bg-white p-6 shadow-lg rounded-lg page-break">
            <div class="flex justify-between items-start mb-4">
                <div>
                    <h3 class="font-bold">Bệnh viện Nhi Đồng 1</h3>
                    <p class="text-sm">Ban QLCLXN</p>
                </div>
                <div class="text-right text-xs">
                    <p>FM-EQ-AL-003/3 V3.0</p>
                    <p>Ngày hiệu lực: 01/01/2020</p>
                </div>
            </div>

            <h1 class="header-title">PHIẾU THEO DÕI NHIỆT ĐỘ TỦ ÂM SÂU (-70°C)</h1>

            <div class="grid grid-cols-2 gap-4 mb-4 text-sm">
                <p><strong>Mã thiết bị:</strong> ........ 047</p>
                <p><strong>Tháng:</strong> 04 <strong>Năm:</strong> 2026</p>
            </div>

            <div class="overflow-x-auto">
                <table class="min-w-max">
                    <thead>
                        <tr class="bg-gray-50">
                            <th rowspan="2">Ngày</th>
                            <script>
                                for(let i=1; i<=31; i++) document.write(`<th colspan="2">${i}</th>`);
                            </script>
                        </tr>
                        <tr class="bg-gray-50">
                            <script>
                                for(let i=1; i<=31; i++) document.write(`<th>S</th><th>C</th>`);
                            </script>
                        </tr>
                    </thead>
                    <tbody>
                        <script>
                            const temps = [-65, -70, -75, -80, -85];
                            temps.forEach(t => {
                                document.write(`<tr><td class="font-bold bg-gray-50">${t}</td>`);
                                for(let i=1; i<=62; i++) document.write(`<td></td>`);
                                document.write(`</tr>`);
                            });
                        </script>
                        <tr>
                            <td class="font-bold bg-gray-50">Ký tên</td>
                            <script>
                                for(let i=1; i<=62; i++) document.write(`<td class="h-8"></td>`);
                            </script>
                        </tr>
                    </tbody>
                </table>
            </div>
            <p class="mt-2 text-xs italic text-gray-600">* S: 7:30-8:00, C: 15:30-16:00</p>
        </section>

    </div>

    <div class="no-print fixed bottom-4 right-4">
        <button onclick="window.print()" class="bg-blue-600 text-white px-6 py-2 rounded-full shadow-lg hover:bg-blue-700 transition">
            In Phiếu
        </button>
    </div>

</body>
</html>
