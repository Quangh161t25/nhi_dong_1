<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NHI_ĐỒNG_1</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <!-- JSRSAsign for JWT -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsrsasign/10.5.27/jsrsasign-all-min.js"></script>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        background: '#f0fdfa',
                        card: '#ffffff',
                        border: '#ccfbf1',
                        primary: { DEFAULT: '#0d9488', foreground: '#ffffff' },
                        muted: { DEFAULT: '#f0fdfa', foreground: '#5eead4' }
                    }
                }
            }
        }
    </script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(160deg, #f0fdfa 0%, #e0f2fe 40%, #f0f9ff 100%);
            min-height: 100vh;
        }

        .hidden {
            display: none !important;
        }

        .flex {
            display: flex !important;
        }

        .h-screen {
            height: 100vh !important;
        }

        .inset-0 {
            position: fixed;
            top: 0;
            right: 0;
            bottom: 0;
            left: 0;
        }

        .z-login {
            z-index: 100;
        }

        .bg-login-bg {
            background: linear-gradient(160deg, #f0fdfa 0%, #ccfbf1 50%, #e0f2fe 100%);
        }

        .login-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        .flex-center {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(13, 148, 136, 0.15);
            border-left-color: #0d9488;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0;
            }

            100% {
                background-position: 200% 0;
            }
        }

        /* Modern Header */
        .app-header {
            background: linear-gradient(135deg, #0f766e 0%, #0d9488 50%, #14b8a6 100%);
            color: white;
            padding: 0 1.5rem;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 30;
            box-shadow: 0 4px 20px -4px rgba(13, 148, 136, 0.3);
        }

        .app-header h1 {
            font-size: 1rem;
            font-weight: 700;
            margin: 0;
            letter-spacing: -0.01em;
            line-height: 1.3;
        }

        @media(min-width:768px) {
            .app-header {
                padding: 0 2rem;
            }

            .app-header h1 {
                font-size: 1.125rem;
            }
        }

        /* User Menu Dropdown */
        #userMenuDropdown {
            transform-origin: top right;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #userMenuDropdown.hidden {
            opacity: 0;
            transform: scale(0.95);
            pointer-events: none;
            display: block !important;
        }

        .user-menu-item {
            display: flex;
            align-items: center;
            padding: 0.625rem 1rem;
            width: 100%;
            border-radius: 0.5rem;
            color: #475569;
            font-size: 0.875rem;
            transition: all 0.15s;
            font-weight: 500;
        }

        .user-menu-item:hover {
            background-color: #f0fdfa;
            color: #0f172a;
        }

        .user-menu-item svg {
            width: 1.25rem;
            height: 1.25rem;
            margin-right: 0.75rem;
            flex-shrink: 0;
            color: #64748b;
            transition: color 0.15s;
        }

        .user-menu-item:hover svg {
            color: #0f172a;
        }

        .user-menu-item.logout {
            color: #dc2626;
        }

        .user-menu-item.logout:hover {
            background-color: #fef2f2;
            color: #b91c1c;
        }

        .user-menu-item.logout:hover svg {
            color: #b91c1c;
        }

        /* Form Card */
        .form-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(204, 251, 241, 0.6);
            border-radius: 1.5rem;
            box-shadow: 0 8px 32px -8px rgba(13, 148, 136, 0.1), 0 1px 3px rgba(0, 0, 0, 0.04);
            animation: fadeInUp 0.5s ease-out;
        }

        .form-card:hover {
            box-shadow: 0 12px 40px -8px rgba(13, 148, 136, 0.15), 0 1px 3px rgba(0, 0, 0, 0.04);
        }

        /* Input Styles */
        .input-modern {
            width: 100%;
            background: rgba(240, 253, 250, 0.5);
            border: 1.5px solid #ccfbf1;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: #0f172a;
            font-size: 0.9375rem;
            transition: all 0.2s;
            outline: none;
        }

        .input-modern::placeholder {
            color: #94a3b8;
        }

        .input-modern:focus {
            border-color: #14b8a6;
            box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.15);
            background: #fff;
        }

        .input-readonly {
            width: 100%;
            background: #f0fdfa;
            border: 1.5px solid transparent;
            border-radius: 0.75rem;
            padding: 0.75rem 1rem;
            color: #64748b;
            font-weight: 500;
            cursor: not-allowed;
        }

        /* Sticky Footer Mobile */
        @media (max-width: 768px) {
            .mobile-sticky-footer {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: rgba(255, 255, 255, 0.9);
                backdrop-filter: blur(10px);
                padding: 1rem;
                z-index: 40;
                border-top: 1px solid #ccfbf1;
                box-shadow: 0 -4px 12px -2px rgba(13, 148, 136, 0.08);
            }

            .content-pb {
                padding-bottom: 5rem;
            }
        }
    </style>
</head>

<body class="antialiased">

    <!-- Màn hình đăng nhập (Mặc định hiện) -->
    <div id="loginScreen" class="inset-0 z-login flex-center bg-login-bg">
        <div
            class="login-card p-8 md:p-10 rounded-[2rem] shadow-2xl shadow-blue-900/10 w-full max-w-sm border border-white mx-4 relative overflow-hidden">
            <div class="absolute top-0 inset-x-0 h-2 bg-gradient-to-r from-teal-500 to-cyan-500"></div>
            <div class="flex justify-center mb-8">
                <div
                    class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-teal-600 to-cyan-600 tracking-tight">
                    Nhi đồng 1</div>
            </div>
            <!-- Loading Indicator -->
            <div id="loginLoading" class="hidden text-center py-6">
                <div class="spinner"></div>
                <p class="text-sm text-slate-500 font-medium">Đang tải dữ liệu nhân viên...</p>
            </div>
            <!-- Form Đăng nhập -->
            <div id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-700">Tài khoản</label>
                    <input type="text" id="usernameInput"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white"
                        placeholder="Mã ID nhân viên">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-700">Mật khẩu</label>
                    <input type="password" id="passwordInput"
                        class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 focus:bg-white"
                        placeholder="••••••••" onkeydown="if(event.key==='Enter') handleLogin()">
                </div>
                <div class="pt-2">
                    <button onclick="handleLogin()"
                        class="w-full bg-gradient-to-r from-teal-600 to-cyan-600 text-white font-bold text-lg py-3.5 rounded-xl hover:from-teal-700 hover:to-cyan-700 shadow-md hover:shadow-lg hover:-translate-y-0.5 transition-all active:translate-y-0">Đăng
                        nhập</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Màn hình chính (Mặc định ẩn) -->
    <div id="mainApp" class="hidden" style="min-height:100vh;">

        <!-- Header -->
        <header class="app-header">
            <div class="flex items-center gap-3">
                <div class="w-9 h-9 bg-white/20 rounded-xl flex items-center justify-center shrink-0 backdrop-blur-sm">
                    <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                    </svg>
                </div>
                <h1>Khoa Xét nghiệm Huyết Học — Bệnh viện Nhi Đồng 1</h1>
            </div>
            <div class="flex items-center gap-3">
                <!-- User Profile -->
                <div class="relative">
                    <button onclick="toggleUserInfo()" id="userMenuButton"
                        class="flex items-center gap-2.5 p-1 pl-2 hover:bg-white/10 rounded-full transition">
                        <div id="userProfileInfo" class="flex flex-col items-end leading-tight mr-1 hidden"
                            style="transition:all 0.3s ease; overflow:hidden; max-width:0; opacity:0;">
                            <span id="userNameHeader" class="text-sm font-bold text-white whitespace-nowrap">---</span>
                            <span id="userRoleHeader"
                                class="text-[11px] font-semibold text-white/70 capitalize whitespace-nowrap">---</span>
                        </div>
                        <div class="relative items-center flex">
                            <div id="userAvatar"
                                class="w-9 h-9 rounded-full bg-white/25 backdrop-blur-sm flex items-center justify-center text-white font-bold text-sm shadow-sm border border-white/30 cursor-pointer">
                                ?</div>
                            <div
                                class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-400 border-2 border-teal-700 rounded-full">
                            </div>
                        </div>
                    </button>
                    <!-- User Menu Dropdown -->
                    <div id="userMenuDropdown"
                        class="hidden absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-2xl shadow-xl p-1.5 z-50">
                        <div class="px-3 py-3 border-b border-slate-100 mb-1">
                            <div id="userNameHeaderMobile" class="text-sm font-bold text-slate-800">---</div>
                            <div id="userRoleHeaderMobile"
                                class="text-xs font-semibold text-slate-400 capitalize mt-0.5">---</div>
                        </div>
                        <button class="user-menu-item">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                            Hồ sơ cá nhân
                        </button>
                        <button class="user-menu-item">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37a1.724 1.724 0 002.572-1.065z" />
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            Cài đặt hệ thống
                        </button>
                        <button class="user-menu-item">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                            </svg>
                            Đổi mật khẩu
                        </button>
                        <div class="my-1 border-t border-slate-100"></div>
                        <button onclick="logout()" class="user-menu-item logout">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                            Đăng xuất
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="p-4 md:p-8">
            <div class="max-w-2xl mx-auto pb-10">
                <div class="form-card p-5 md:p-8">
                    <div class="flex items-center gap-3 mb-6 md:mb-8 pb-4" style="border-bottom: 1.5px solid #ccfbf1;">
                        <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0"
                            style="background:linear-gradient(135deg,#ccfbf1,#99f6e4);">
                            <svg class="w-6 h-6" style="color:#0f766e;" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                            </svg>
                        </div>
                        <h2 class="text-xl md:text-2xl font-black tracking-tight" style="color:#0f766e;">Ghi nhận Nhiệt
                            độ Tủ</h2>
                    </div>

                    <div class="space-y-6 md:space-y-8 content-pb">
                        <!-- Row QR -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
                            <div>
                                <label class="block text-sm font-bold mb-2" style="color:#334155;">ID Tủ (Mã QR) <span
                                        class="text-red-500">*</span></label>
                                <div class="flex gap-2">
                                    <input type="text" id="input_id_tu" oninput="handleIdTuChange(this.value)"
                                        class="input-modern flex-1 uppercase font-bold"
                                        placeholder="Nhập hoặc quét mã...">
                                    <button type="button" onclick="toggleQRScanner()"
                                        class="text-white px-4 py-3 rounded-xl font-medium transition-all flex items-center justify-center shadow-sm active:scale-95 shrink-0"
                                        style="background:linear-gradient(135deg,#0d9488,#14b8a6);">
                                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                                d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm14 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z" />
                                        </svg>
                                    </button>
                                </div>
                                <input type="hidden" id="input_qr_code">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2" style="color:#334155;">Tên tủ</label>
                                <input type="text" id="input_ten" class="input-readonly" readonly
                                    placeholder="Tự động điền">
                            </div>
                        </div>

                        <div id="qr-scanner-container" class="hidden my-4 p-4 rounded-2xl shadow-inner"
                            style="border:1.5px solid #ccfbf1; background:rgba(240,253,250,0.6);">
                            <div id="reader" class="overflow-hidden rounded-xl"
                                style="width:100%; border:1.5px solid #ccfbf1;"></div>
                            <div class="mt-4 text-center">
                                <button type="button" onclick="stopQRScanner()"
                                    class="px-5 py-2.5 bg-white border border-red-200 text-red-600 rounded-xl text-sm font-bold hover:bg-red-50 transition-all shadow-sm">Đóng
                                    máy ảnh</button>
                            </div>
                        </div>

                        <!-- Row 2 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
                            <div>
                                <label class="block text-sm font-bold mb-2" style="color:#334155;">Vị trí</label>
                                <input type="text" id="input_vi_tri" class="input-readonly" readonly
                                    placeholder="Tự động điền">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2" style="color:#334155;">Khung giờ</label>
                                <input type="hidden" id="input_khung_h" value="Sáng">
                                <div id="khung-gio-buttons" class="grid grid-cols-4 gap-2"></div>
                            </div>
                        </div>

                        <div
                            style="height:1px; background:linear-gradient(90deg,transparent,#99f6e4,transparent); margin:1rem 0;">
                        </div>

                        <!-- Row 3: Limits -->
                        <div class="grid grid-cols-2 md:grid-cols-3 gap-4 md:gap-6">
                            <div>
                                <label class="block text-[11px] md:text-sm font-bold mb-2" style="color:#64748b;">Cảnh
                                    báo Dưới (°C)</label>
                                <input type="text" id="input_nhiet_do_min"
                                    class="input-readonly text-center font-black text-lg" readonly placeholder="--">
                            </div>
                            <div>
                                <label class="block text-[11px] md:text-sm font-bold mb-2" style="color:#64748b;">Cảnh
                                    báo Trên (°C)</label>
                                <input type="text" id="input_nhiet_do_max"
                                    class="input-readonly text-center font-black text-lg" readonly placeholder="--">
                            </div>
                            <div class="col-span-2 md:col-span-1 p-4 md:p-0 rounded-2xl md:rounded-none -mx-2 md:mx-0"
                                style="background:rgba(204,251,241,0.4); border:1.5px solid #99f6e4; border-radius:1rem;">
                                <label class="block text-sm font-black mb-2 tracking-wide" style="color:#0f766e;">NHIỆT
                                    ĐỘ ĐO ĐƯỢC <span class="text-red-500">*</span></label>
                                <input type="number" step="any" id="input_nhiet_do_do_dc" oninput="calculateKetQua()"
                                    class="w-full bg-white rounded-xl px-4 py-3 font-black text-center text-xl shadow-sm transition-all"
                                    style="border:2px solid #14b8a6; color:#0f766e; outline:none;" placeholder="0.0"
                                    onfocus="this.style.boxShadow='0 0 0 4px rgba(20,184,166,0.2)'"
                                    onblur="this.style.boxShadow='none'">
                            </div>
                        </div>

                        <!-- Row 4 -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-5 md:gap-6">
                            <div>
                                <label class="block text-sm font-bold mb-2" style="color:#334155;">Tình trạng (Tự
                                    động)</label>
                                <input type="text" id="input_ket_qua"
                                    class="input-readonly text-center font-black text-xl uppercase tracking-wider"
                                    readonly placeholder="-">
                            </div>
                            <div>
                                <label class="block text-sm font-bold mb-2" style="color:#334155;">Ghi chú sự cố</label>
                                <textarea id="input_ghi_chu" rows="2" class="input-modern resize-y"
                                    placeholder="Ghi nhận sai số, vệ sinh..."></textarea>
                            </div>
                        </div>

                        <!-- Signature -->
                        <div class="pt-2">
                            <label class="block text-sm font-bold mb-3 flex justify-between items-center"
                                style="color:#334155;">
                                <span>Chữ ký nhân viên trực</span>
                                <button type="button" onclick="clearSignature()"
                                    class="text-[11px] font-bold text-slate-500 hover:text-red-600 transition tracking-wide uppercase px-2.5 py-1.5 rounded-lg border border-slate-200 hover:border-red-200 hover:bg-red-50 active:scale-95 bg-white shadow-sm">Ký
                                    lại</button>
                            </label>
                            <div class="w-full overflow-hidden relative touch-none group"
                                style="height:180px; border:2px solid #99f6e4; border-radius:1rem; background:#f0fdfa;">
                                <canvas id="signature-pad"
                                    class="w-full h-full cursor-crosshair touch-none absolute inset-0 z-10"
                                    style="touch-action:none;"></canvas>

        async function getAccessToken() {
            if (accessToken && Date.now() < tokenExpiry - 300000) return accessToken;
            const header = { alg: "RS256", typ: "JWT" };
            const now = Math.floor(Date.now() / 1000);
            const payload = {
                iss: CONFIG.serviceAccountEmail,
                scope: CONFIG.scopes.join(" "),
                aud: CONFIG.tokenUrl,
                exp: now + 3600,
                iat: now
            };
            const sJWT = KJUR.jws.JWS.sign("RS256", JSON.stringify(header), JSON.stringify(payload), CONFIG.privateKey);

            try {
                const response = await fetch(CONFIG.tokenUrl, {
                    method: "POST",
                    headers: { "Content-Type": "application/x-www-form-urlencoded" },
                    body: `grant_type=urn:ietf:params:oauth:grant-type:jwt-bearer&assertion=${sJWT}`
                });
                const data = await response.json();
                accessToken = data.access_token;
                tokenExpiry = Date.now() + (data.expires_in * 1000);
                return accessToken;
            } catch (err) { alert("Không thể xác thực với Google API"); return null; }
        }

            const isPlasmaRange = !isNaN(minVal) && !isNaN(maxVal) && minVal >= -35 && maxVal <= -25;

            let options;
            if (isPlasmaRange) {
                options = [
                    { id: 'L1', label: 'L1 7H' },
                    { id: 'L2', label: 'L2 11H' },
                    { id: 'L3', label: 'L3 15H' },

                    { id: 'L6', label: 'L6 3H' }
                ];
                container.className = 'grid grid-cols-3 gap-2';
            } else {
                options = [
                    { id: 'Sáng', label: 'Sáng' },
                    { id: 'Chiều', label: 'Chiều' }
                ];
                container.className = 'grid grid-cols-2 gap-2';
            }

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.onclick = () => setKhungGio(opt.id);

        function populateKhungGio(tuTypeStr) {
            const hr = new Date().getHours();
            let defaultVal = 'Sáng';

            // Check temperature range from inputs
            const minVal = parseFloat(String(document.getElementById('input_nhiet_do_min').value).replace(',', '.'));
            const maxVal = parseFloat(String(document.getElementById('input_nhiet_do_max').value).replace(',', '.'));
            const isPlasmaRange = !isNaN(minVal) && !isNaN(maxVal) && minVal >= -35 && maxVal <= -25;

            if (isPlasmaRange) {
                if (hr >= 7 && hr < 11) defaultVal = 'L1';
                else if (hr >= 11 && hr < 15) defaultVal = 'L2';
                else if (hr >= 15 && hr < 19) defaultVal = 'L3';
                else if (hr >= 19 && hr < 23) defaultVal = 'L4';
                else if (hr >= 23 || hr < 3) defaultVal = 'L5';
                else defaultVal = 'L6';
            } else {
                defaultVal = (hr >= 16) ? 'Chiều' : 'Sáng';
            }

            setKhungGio(defaultVal);
        }

        function calculateKetQua() {

            const val = parseFloat(valStr.replace(',', '.'));
            const min = parseFloat(String(minStr).replace(',', '.'));
            const max = parseFloat(String(maxStr).replace(',', '.'));

            let kq = "ĐẠT";

                    id_tu_val, ten_val, vi_tri_val, nhiet_do_min_val, nhiet_do_max_val,
                    nhiet_do_do_dc_val, ket_qua_val, id_nv_val, ghi_chu_val, chu_ky_val,
                    xac_nhan_val, udt_val, lb1_val, "'" + nam_thang_val, nam_thang_tu_val
                ];
                const rowCV = [
                    genId(),
                    ngay_val,
                    id_nv_val,
                    ten_nv_val,
                    true,
                    true,
                    udt_val
                ];
                const nowTotalMinutes = now.getHours() * 60 + now.getMinutes();
                const shouldAppendCV = (khung_h_val === 'Sáng' || khung_h_val === 'L1') && (nowTotalMinutes >= 390 && nowTotalMinutes <= 510);

                const sid = CONFIG.spreadsheetId;
                const urlData = `https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/DATA:append?valueInputOption=USER_ENTERED`;
                const urlCV = `https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/CV:append?valueInputOption=USER_ENTERED`;

                const resData = await fetch(urlData, {
                    method: 'POST',
                    headers: {
                        "Authorization": `Bearer ${token}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ values: [rowData] })
                });
                let resCV = { ok: true };
                if (shouldAppendCV) {
                    resCV = await fetch(urlCV, {
                        method: 'POST',
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ values: [rowCV] })
                    });
                }

                // DATA_ALL logic: Check for duplicates and append if not exists
                try {
                    const id_all = `${nam_thang_val} | ${ten_val}`;
                    const urlAllCheck = `https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/DATA_ALL!A:A`;
                    const resCheckAll = await fetch(urlAllCheck, { headers: { "Authorization": `Bearer ${token}` } });
                    const dataCheckAll = await resCheckAll.json();

                    let existsInAll = false;
                    if (dataCheckAll.values) {
                        existsInAll = dataCheckAll.values.flat().some(v => v === id_all);
                    }

                    if (!existsInAll) {
                        const urlAllAppend = `https://sheets.googleapis.com/v4/spreadsheets/${sid}/values/DATA_ALL:append?valueInputOption=USER_ENTERED`;
                        await fetch(urlAllAppend, {
                            method: 'POST',
                            headers: {
                                "Authorization": `Bearer ${token}`,
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({ values: [[id_all, "'" + nam_thang_val, ten_val]] })
                        });
                    }
                } catch (allErr) {
                    console.error("DATA_ALL error:", allErr);
                    // We don't alert the user for data_all failure to avoid blocking the main flow
                }

                if (resData.ok && resCV.ok) {
                    alert("Lưu dữ liệu thành công!");
                    // Reset
                    document.getElementById('input_id_tu').value = '';
                    document.getElementById('input_qr_code').value = '';
                    handleIdTuChange('');
                    document.getElementById('input_nhiet_do_do_dc').value = '';
                    document.getElementById('input_ghi_chu').value = '';
                    clearSignature();
                } else {
                    const errData = resData.ok ? null : await resData.json();
                    const errCV = resCV.ok ? null : await resCV.json();
                    console.error({ errData, errCV });
                    alert("Lỗi khi lưu dữ liệu. Vui lòng thử lại!");
                }
            } catch (e) {
                console.error(e);
                alert("Có lỗi xảy ra: " + e.message);
            } finally {
                btn.innerHTML = oriText;
                btn.disabled = false;
            }
        }
    </script>
</body>

</html>
